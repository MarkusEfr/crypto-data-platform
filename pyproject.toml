[project]
name = "crypto-data-platform"
version = "0.1.0"
description = ""
authors = [
    {name = "MarkusEfr",email = "markus.efr@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "psycopg[binary] (>=3.3.9,<4.0.0)"
]

[tool.poetry]
packages = [{include = "crypto_data_platform", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]
